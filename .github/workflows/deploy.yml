name: Build and Deploy to Azure

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Download codice
      uses: actions/checkout@v4

    - name: Login ad Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build e Push Immagine Docker
      run: |
        docker build -t ${{ secrets.ACR_SERVER }}/portfolio-cloud:${{ github.sha }} .
        docker push ${{ secrets.ACR_SERVER }}/portfolio-cloud:${{ github.sha }}

    - name: Deploy su Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        images: '${{ secrets.ACR_SERVER }}/portfolio-cloud:${{ github.sha }}'